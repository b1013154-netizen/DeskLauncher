name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Windows 上での動作確認（表示の優先度・キー送信・コマンド実行）
        run: npx electron .
        env:
          DL_SELFTEST: ${{ runner.temp }}\selftest.json
          DL_USERDATA: ${{ runner.temp }}\dl-userdata
        timeout-minutes: 3
      - run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLauncher-Windows
          path: |
            dist/*.exe
            docs/*.md
          if-no-files-found: error
